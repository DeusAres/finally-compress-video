<!doctype html>
<html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Anteprima intrattenimento</title>
<link rel="stylesheet" href="theme.css">
<style>body{margin:0;padding:16px;background:var(--bg,#f3ecdc);color:var(--text,#1a1c2c)}
#log{font-size:10px;opacity:.6;margin-top:12px}</style></head>
<body>
<div id="fun-slot"></div><div id="log"></div>
<script type="module">
import { mountFun } from './fun.js?v=0.27';
const bus = new EventTarget();
const q = new URLSearchParams(location.search);
const DUR = (+q.get('dur') || 60) * 1000;
const emit = (t, d) => bus.dispatchEvent(new CustomEvent(t, { detail: d }));
const fun = mountFun(document.getElementById('fun-slot'), bus);
window.fun = fun; window.bus = bus;
const t0 = performance.now(), total = 3600; let phase = 'analisi';
emit('phase', { phase: 'analisi' });
setTimeout(() => { phase = 'video'; emit('phase', { phase: 'video' }); }, 2000);
const iv = setInterval(() => {
  const el = (performance.now() - t0) / 1000;
  if (phase !== 'video') return;
  const done = Math.min(total, Math.round(((performance.now() - t0 - 2000) / (DUR - 2000)) * total));
  emit('progress', { phase: 'video', done, total, fps: 55 + 8 * Math.sin(el), etaS: Math.max(0, (DUR - (performance.now() - t0)) / 1000), elapsedS: el });
  if (done >= total) {
    clearInterval(iv); emit('phase', { phase: 'audio' });
    setTimeout(() => emit('phase', { phase: 'scrittura' }), 1000);
    setTimeout(() => { emit('phase', { phase: 'fatto' }); emit('result', { inMB: 184.2, outMB: 61.7, savedPct: 66.5, fileName: 'IMG_0042.mp4' }); }, 2000);
  }
}, 250);
</script></body></html>
