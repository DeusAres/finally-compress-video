        if (t0In === null) t0In = s.timestamp;
        const n = s.numberOfFrames, inp = [];
        for (let c = 0; c < s.numberOfChannels; c++) { const b = new Float32Array(n); s.copyTo(b, { planeIndex: c, format: 'f32-planar' }); inp.push(b); }
        s.close(); await emit(rm.process(inp));
      }
      if (rm.flush) await emit(rm.flush());
    }
    asrc.close(); log(`audio ${echoFix.reencOnly ? 'SOLO ricodificato (nessun filtro)' : 'corretto e ricodificato'} AAC 256 kbps (${nS} blocchi)`);
  } else if (asrc) { let first = true; const cfg = await aac.getDecoderConfig();
    let nA = 0;
    for await (const p of new MB.EncodedPacketSink(aac).packets()) { if (p.timestamp < 0) continue; await asrc.add(p.clone({ timestamp: p.timestamp - frames[0].ts }), first ? { decoderConfig: cfg } : undefined); first = false;
      if (++nA % 256 === 0) { checkCancel(); await whenVisible(); setProg('audio', p.timestamp / durS, 'audio ' + fmtT(p.timestamp) + '/' + fmtT(durS)); await new Promise((r) => setTimeout(r)); } }
    asrc.close(); }
  checkCancel(); setProg('scrittura', 0, 'chiusura file');
  vsrc.close(); await output.finalize(); cur.output = null; await store.flush();
  // moov in coda: lo riscrivo SENZA caricare mdat: leggo solo header + moov dal file OPFS, tronco a prefixLength e appendo il nuovo moov.
  const outSize = await store.size();
  let qtChanges = [];
  const { prefixLength, moov } = await rewriteMoov({ size: outSize, read: (o, l) => store.read(o, l) }, (m) => {
    const r = finishMoov(srcMoov, m, { dvBox, quickTime: mov, audioCopied: !echoFix, strings: {
      'com.apple.quicktime.displayname': label,
      'com.apple.quicktime.description': `finally-compress-video ${VER} · ${mov ? 'MOV' : 'MP4'} · ${sceneQ ? 'qualità per scena (VMAF stimato ≥ 88), limite' : 'target'} ${bitrate / 1e6} Mbps${dsTag ? ' · ridotto a 1080p' : ''} · keyframe ${gopSec}s · audio ${aTag}${apacT ? ' + spaziale (apac)' : ''}${ptSel && ptSel.tracks.some((t) => t.entry === 'mebx') ? ' + metadati iPhone' : ''}` } });
    qtChanges = r.changes; return r.moov; });
  if (qtChanges.length) log(`MOV allineato all'originale: ${qtChanges.join(' · ')}`, 'summary');
  if (mov && srcMoov) { // ftyp della sorgente ('qt  ', minor 0) al posto di quello di Mediabunny se ha la stessa lunghezza (nulla si sposta)
    const ft = sourceFtypPatch(new Uint8Array(await file.slice(0, 64).arrayBuffer()), await store.read(0, 64));
    if (ft) await store.write(0, ft); else log('ftyp: lunghezza diversa dalla sorgente, lasciato quello di Mediabunny', 'warn');
  }
  setProg('scrittura', .3, 'riscrittura moov');
  await store.truncate(prefixLength);
  // senza tracce da copiare: solo ID e ordine dei trak come nella sorgente (addPassthroughTracks con zero tracce)
  const alignIds = (m) => { if (!ptInfo) return m; try { return addPassthroughTracks(m, ptInfo, []).moov; } catch (e) { log(`ID tracce: allineamento non riuscito (${e?.message || e})`, 'warn'); return m; } };
  let moovOut = alignIds(moov), moovPos = prefixLength;
  if (ptSel) { // [mdat Mediabunny][mdat tracce iPhone (largesize se > 4 GB)][moov + trak copiati]: chunk letti dal File sorgente a blocchi (ordine del file), scritti via worker OPFS
    try {
      const plan = planPassthroughMdat(ptSel.tracks, prefixLength), tA = performance.now();
      await store.write(prefixLength, plan.header);
      await copyPassthroughData(plan, { read: async (o, l) => new Uint8Array(await file.slice(o, o + l).arrayBuffer()), write: (p, u8) => store.write(p, u8),
        check: async () => checkCancel(), onProgress: (f) => setProg('scrittura', .3 + .6 * f, apacT ? 'audio spaziale e metadati' : 'metadati iPhone') });
      // trim: stessa traslazione del video (-frames[0].ts) tramite la edit list, nessun campione tagliato
      const r = addPassthroughTracks(moov, ptInfo, ptSel.tracks, { chunkOffsets: plan.chunkOffsets, shiftS: frames[0].ts });
      moovOut = r.moov; moovPos = prefixLength + plan.size;
      const idm = [...r.idMap].map(([a, b]) => `${a}→${b}`).join(' ');
      log(`tracce iPhone copiate: ${r.added.length} (${fmtMB(plan.totalBytes)}${plan.co64 ? ', co64' : ''}${plan.header.length === 16 ? ', mdat 64 bit' : ''}, ${((performance.now() - tA) / 1000).toFixed(1)} s) · ${r.added.map(describeAdded).join(' · ')} · mappa ID ${idm}${frames[0].ts > 0 ? ` · edit list traslate di ${frames[0].ts.toFixed(4)} s` : ''}`, 'summary');
      if (apacT) log(`audio spaziale: copiati ${apacT.sampleCount} campioni, traccia ${r.idMap.get(apacT.trackId)}, gruppo alternativo ${r.alternateGroup} · AAC traccia ${r.aacTrackId} ${ptInfo.aac && !(ptInfo.aac.flags & 1) ? 'disattivata (riserva, come nell\'originale)' : 'attiva (come nell\'originale)'}${r.added.some((a) => a.keys.some((k) => /cinematic-audio/.test(k))) ? ' · cinematic-audio collegata (Mix audio)' : ''}`, 'summary');
      for (const d of r.dropped) log(`tracce iPhone: riferimento ${d} senza traccia corrispondente → rimosso`, 'warn');
    } catch (e) { // copia fallita: file senza tracce extra (il moov di Mediabunny resta valido), errore nel riassunto
      if (cancelled) throw e;
      log(`⚠️ tracce iPhone NON copiate: ${e?.message || e}`, 'warn'); moovOut = alignIds(moov); moovPos = prefixLength; await store.truncate(prefixLength);
    }
  }
  await store.write(moovPos, moovOut); await store.flush(); await store.close();
  const f0 = await store.getFile(); store = null;
  outFile = f0.type === mime && f0.name === outName ? f0 : new File([f0], outName, { type: mime }); // File su disco (OPFS), nessuna copia in RAM; MIME video/quicktime per MOV (share sheet / download)
  setProg('scrittura', 1, 'completato');
  log(`RPU trapiantati: ${rpuUsed}/${nV}${dvBox && rpuUsed !== nV ? ' ⚠️ INCOMPLETO' : ''}. Metadati originali copiati: ${srcMoov ? 'sì' : 'no'}.`);
  let sceneSum = null;
  if (sceneQ && job.manifest.scene) { // riepilogo per scena (anche dei segmenti fatti in run precedenti: record nel manifest)
    const segDur = segStarts.map((a, k) => ({ duration: frames.slice(a, segEnd(segStarts, k, NF)).reduce((x, f) => x + f.dur, 0) }));
    const recs = segStarts.map((_, k) => job.manifest.scene[k] || null);
    sceneSum = sceneSummary(segDur, recs, recs.map((r) => r?.real || 0));
    if (sceneSum) log(`QUALITÀ PER SCENA: ${sceneSum.n} segmenti · distribuzione ${sceneSum.dist} · bitrate scelto ${(sceneSum.min / 1e6).toFixed(1)}–${(sceneSum.max / 1e6).toFixed(1)} Mbps, medio ${(sceneSum.mean / 1e6).toFixed(2)} Mbps (reale ${(sceneSum.realMean / 1e6).toFixed(2)}) · VMAF stimato min ${Number.isFinite(sceneSum.vmafMin) ? sceneSum.vmafMin.toFixed(1) : '—'} / medio ${Number.isFinite(sceneSum.vmafMean) ? sceneSum.vmafMean.toFixed(1) : '—'} · tempo extra delle prove ${sceneSum.trialS.toFixed(1)} s${sceneSum.capped ? ` · ${sceneSum.capped} segmenti al limite di ${bitrate / 1e6} Mbps` : ''}${sceneSum.fallbacks ? ` · ${sceneSum.fallbacks} segmenti senza prove (bitrate dell'utente)` : ''}`);
  }
  await job.remove(); job = null; log('job completato: segmenti OPFS eliminati');
  const pct = (1 - outFile.size / file.size) * 100;
  const mb = (b) => (b / 1048576).toFixed(2);
  log(`COMPRESSIONE: ${mb(file.size)} MB → ${mb(outFile.size)} MB (−${pct.toFixed(1)}%, ${(file.size / outFile.size).toFixed(2)}×). Bitrate medio ${(file.size * 8 / durS / 1e6).toFixed(1)} → ${(outFile.size * 8 / durS / 1e6).toFixed(1)} Mbps (target video ${bitrate / 1e6} Mbps, keyframe ogni ${gopSec} s), durata ${durS.toFixed(2)} s.`);
  const tgt = sceneSum ? sceneSum.mean : bitrate;
  log(`bitrate video reale medio ${(segBytes * 8 / durS / 1e6).toFixed(2)} Mbps vs target ${sceneSum ? 'medio per scena ' + (tgt / 1e6).toFixed(2) : bitrate / 1e6} Mbps (${((segBytes * 8 / durS / tgt - 1) * 100).toFixed(1)}%)${job0Br ? `, encoder finale ${(job0Br / 1e6).toFixed(2)} Mbps` : ''}.`);
  log(`file: ${outName}`);
  log(`fatto in ${((performance.now() - T0) / 1000).toFixed(1)} s.`);
  emit('phase', { phase: 'fatto' }); emit('result', { inMB: file.size / MB_, outMB: outFile.size / MB_, savedPct: pct, fileName: outName, sceneBr: sceneSum ? { min: sceneSum.min / 1e6, max: sceneSum.max / 1e6, mean: sceneSum.mean / 1e6 } : undefined });
  { const n = chimeDone({ savedPct: pct, fileName: outName }); log(`fine: jingle${n ? ' + notifica' : ' (notifiche disponibili solo dalla web app installata)'}`); }
}

function onSave() {
  // share() va chiamato subito nel tap (user activation ~5 s), senza await prima; promise non attesa per la UI.
  if (!outFile) return;
  if (!window.claude?.use) {
    const f = outFile; // File OPFS: niente copie in RAM
    if (navigator.canShare?.({ files: [f] })) { navigator.share({ files: [f] }).catch((e) => { if (e?.name !== 'AbortError') ui.setSaveMessage('Condivisione non riuscita: ' + e.message); }); return; }
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(outFile), download: outName }); document.body.appendChild(a); a.click(); a.remove(); return;
  }
  saveViaArtifact();
}
async function saveViaArtifact() {
  const dl = await window.claude.use('downloads');
  if (!dl) { ui.setSaveMessage( 'Il salvataggio non è disponibile in questa vista.'); return; }
  try { const r = await dl.save({ filename: outName, data: outFile }); ui.setSaveMessage( r.status === 'saved' ? 'Salvato. Aprilo da File e scegli «Salva video» per metterlo in Foto.' : ''); }
  catch (e) { ui.setSaveMessage( `Non salvato (${e.code || e.message}).`); }
}

ui = mountUI(document.getElementById('app'), {
  onFile, onStart: start, onPip, onCancel() { cancelled = true; log('Annullamento richiesto'); }, onSave,
}, { version: BUILD_LABEL.startsWith('__') ? VER : BUILD_LABEL });
ui.setDefaults({ bitrateMbps: 8, keyframeS: 4, audioMode: 'copy', bgAudio: false, par2: true, apac: true, container: 'mov' });
// Niente zoom (iOS ignora user-scalable): blocco doppio tocco e pinch.
for (const t of ['dblclick', 'gesturestart', 'gesturechange']) document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTouchEnd < 350 && !e.target.closest?.('input,select,textarea')) e.preventDefault(); lastTouchEnd = n; }, { passive: false });

// ---- Aggiornamenti / offline (sw.js) ----
// Il sito è servito da GitHub Pages senza CI: tools/stamp-version.sh scrive version.txt (= BUILD_ID) prima del commit.
// All'avvio e al ritorno in primo piano si legge version.txt oltre ogni cache; se è nuovo: reload automatico UNA volta per id
// (solo senza export in corso né video scelto; un job interrotto si riprende da OPFS), altrimenti un tasto «tocca per aggiornare».
let updating = false;
const updateBtn = $('update');
async function freshReload() {
  updating = true; log('aggiornamento: ricarico la pagina');
  try { await fetch('index.html', { cache: 'reload' }); } catch { /* offline: reload semplice */ }
  location.reload();
}
function offerUpdate(id) {
  updateBtn.textContent = 'Nuova versione disponibile — tocca per aggiornare';
  updateBtn.hidden = false; updateBtn.onclick = freshReload;
  log(`aggiornamento: offerta mostrata (${id})`);
}
async function checkUpdate() {
  if (BUILD_ID.startsWith('__') || updating) return;
  try {
    const r = await fetch(`version.txt?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return;
    const id = (await r.text()).trim();
    if (!id || id === BUILD_ID) return;
    log(`aggiornamento: nuova versione ${BUILD_ID} -> ${id}`);
    let tried = null; try { tried = sessionStorage.getItem('fcv_reload_for'); } catch { /* storage bloccato */ }
    if (!running && !file && tried !== id) {   // una sola volta per id: la CDN può servire ancora il vecchio index.html (niente loop)
      try { sessionStorage.setItem('fcv_reload_for', id); } catch { /* storage bloccato */ }
      return freshReload();
    }
    offerUpdate(id);
  } catch { /* offline */ }
}
// sw.js solo da https (localhost/file: rete normale). persist(): il browser non sfratta l'app in cache né il job OPFS.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').then(() => log('sw: registrato'), (e) => log('sw: ' + (e?.message || e)));
  navigator.storage?.persist?.().then((ok) => log(`storage persist: ${ok}`), () => {});
}
checkUpdate();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
addEventListener('pageshow', (e) => { if (e.persisted) checkUpdate(); });
</script>
