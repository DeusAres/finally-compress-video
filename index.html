        it.status = ST.ERR; it.error = e?.name === 'QuotaExceededError' || e?.name === 'DownscaleError' || e?.name === 'FramesUnverified' ? friendlyError(e) : `${e?.name ? e.name + ': ' : ''}${e?.message || e}`;
        chimeFail(`${it.key.name}: ${it.error}`.slice(0, 120)); res = 'err';
      }
    }
  } finally {
    if (TSTART) bgSummary();
    log(resLine('fine voce'));
    TSTART = 0; analysis = null; savedJob = null; info = null; file = null; outNameHook = null; cancelled = false; qCurId = 0;
    logPrefix = ''; logQ = 0;
    await annotateResume().catch(() => {});
    saveQ(); renderQueue();
  }
  return res;
}
async function startQueue(s) {
  const first = nextItem(Q, (id) => qFiles.has(id));
  if (!first) { setQMsg(Q.items.some(needsFile) ? 'Riseleziona i video da comprimere («Riseleziona i video»).' : 'Nessun video in attesa nella coda.', 'warn'); return; }
  logPrefix = ''; logQ = 0;
  beginSession(s, qFiles.get(first.id)); // SINCRONO nel tap: PiP preparata sul primo video, resta aperta per tutta la coda
  qRun = { stop: false, t0: performance.now(), said: false }; qMsg = null;
  Q.settings = { ...cfg }; ui.queueStart();
  const n0 = Q.items.filter((it) => it.status === ST.WAIT && qFiles.has(it.id)).length;
  log(`CODA: ${n0} video da comprimere uno alla volta, nell'ordine (${cfg.sceneQ ? `per scena ≤ ${cfg.bitrateMbps}` : cfg.bitrateMbps} Mbps, key ${cfg.keyframeS}s, audio ${cfg.audioMode}${cfg.downscale ? ', 1080p' : ''}, ${cfg.container.toUpperCase()})`, 'summary');
  saveQ(); renderQueue();
  let stopText = '', fatal = null;
  try {
    await releasing;
    if (outFile || outUrl) await releaseResult();
    await acquireWake();
    for (;;) {
      if (qRun.stop) break;
      const it = nextItem(Q, (id) => qFiles.has(id)); if (!it) break;
      const r = await runQueueItem(it);
      if (r?.space) { stopText = `Coda fermata: ${r.space}${readyToSave(Q).length ? ' Salva nelle Foto i video già pronti (si libera spazio), poi tocca «Comprimi» per continuare.' : ''}`; break; }
    }
  } catch (e) { fatal = e; logFailure(e); }
  finally {
    const stopped = !!qRun?.stop, st = queueStats(Q), wall = (performance.now() - qRun.t0) / 1000;
    qRun = null; qCurId = 0; logPrefix = ''; logQ = 0;
    for (const l of summaryLines(Q)) log(l, 'summary');
    log(`CODA: tempo totale ${fmtT(wall)}${stopped ? ' (fermata dall\'utente)' : ''}`, 'summary');
    if (stopText || fatal) { const m = stopText || `Coda interrotta: ${fatal?.message || fatal}`; qMsg = { text: m, kind: 'bad' }; chimeFail(m.slice(0, 120)); }
    else if (stopped) qMsg = { text: 'Coda fermata. Tocca «Comprimi» per continuare: il video interrotto riprende dai segmenti già pronti.', kind: 'warn' };
    else if (st.done) { const n = chimeDone({ savedPct: st.pct, fileName: `${st.done} video${st.err ? `, ${st.err} con errore` : ''}` }); log(`fine coda: jingle${n ? ' + notifica' : ''}`); }
    await endSession();
    saveQ();
    const finished = !stopText && !fatal && !stopped && (st.done + st.err + st.cancel) > 0;
    if (finished) ui.showQueueDone();
    ui.setBusy(false);
    renderQueue(); updateEstimate();
  }
}

ui = mountUI(document.getElementById('app'), {
  onFile, onStart: start, onPip, onCancel() { cancelled = true; log(qRun ? 'Annullamento richiesto per questo video (la coda prosegue)' : 'Annullamento richiesto'); }, onSave,
  onStorageOpen: stRefresh, onStorageAct,
  onQueueAdd, onQueueRemove, onQueueRetry, onQueueStop, onQueueSave, onQueueSaveAll, onQueueClear: clearQueueAll,
}, { version: BUILD_LABEL.startsWith('__') ? VER : BUILD_LABEL });
ui.setDefaults({ bitrateMbps: 8, keyframeS: 4, audioMode: 'copy', bgAudio: false, par2: true, par3: false, apac: true, container: 'mov' });
// Niente zoom (iOS ignora user-scalable): blocco doppio tocco e pinch.
for (const t of ['dblclick', 'gesturestart', 'gesturechange']) document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTouchEnd < 350 && !e.target.closest?.('input,select,textarea')) e.preventDefault(); lastTouchEnd = n; }, { passive: false });

// ---- Aggiornamenti / offline (sw.js) ----
// Il sito è servito da GitHub Pages senza CI: tools/stamp-version.sh scrive version.txt (= BUILD_ID) prima del commit.
// All'avvio e al ritorno in primo piano si legge version.txt oltre ogni cache; se è nuovo: reload automatico UNA volta per id
// (solo senza export in corso né video scelto; un job interrotto si riprende da OPFS), altrimenti un tasto «tocca per aggiornare».
let updating = false;
const updateBtn = $('update');
async function freshReload() {
  updating = true; log('aggiornamento: ricarico la pagina');
  try { await fetch('index.html', { cache: 'reload' }); } catch { /* offline: reload semplice */ }
  location.reload();
}
function offerUpdate(id) {
  updateBtn.textContent = 'Nuova versione disponibile — tocca per aggiornare';
  updateBtn.hidden = false; updateBtn.onclick = freshReload;
  log(`aggiornamento: offerta mostrata (${id})`);
}
async function checkUpdate() {
  if (BUILD_ID.startsWith('__') || updating) return;
  try {
    const r = await fetch(`version.txt?t=${Date.now()}`, { cache: 'no-store' });
    if (!r.ok) return;
    const id = (await r.text()).trim();
    if (!id || id === BUILD_ID) return;
    log(`aggiornamento: nuova versione ${BUILD_ID} -> ${id}`);
    let tried = null; try { tried = sessionStorage.getItem('fcv_reload_for'); } catch { /* storage bloccato */ }
    if (!running && !file && !Q && tried !== id) {   // una sola volta per id: la CDN può servire ancora il vecchio index.html (niente loop)
      try { sessionStorage.setItem('fcv_reload_for', id); } catch { /* storage bloccato */ }
      return freshReload();
    }
    offerUpdate(id);
  } catch { /* offline */ }
}
// sw.js solo da https (localhost/file: rete normale). persist(): il browser non sfratta l'app in cache né il job OPFS.
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  navigator.serviceWorker.register('sw.js').then(() => log('sw: registrato'), (e) => log('sw: ' + (e?.message || e)));
  navigator.storage?.persist?.().then((ok) => log(`storage persist: ${ok}`), () => {});
}
checkUpdate();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkUpdate(); });
addEventListener('pageshow', (e) => { if (e.persisted) checkUpdate(); });
</script>
