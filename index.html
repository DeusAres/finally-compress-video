  else { notice(''); acquireWake(); }

// Stima preventiva: spazio OPFS disponibile rispetto alla dimensione stimata in uscita (bitrate × durata). Ritorna {ok, text}.
async function checkSpace(br = cfg.bitrateMbps) {
  if (!file) return { ok: false, text: '' };

  if (!opfsSupported()) return { ok: false, text: 'Archiviazione OPFS non disponibile in questo browser: impossibile elaborare in streaming.' };

(async () => {

const PH = { analisi: [0, .05, 'Fase 1/4 · analisi'], video: [.05, .80, 'Fase 2/4 · video'], audio: [.85, .12, 'Fase 3/4 · audio'], scrittura: [.97, .03, 'Fase 4/4 · scrittura'] };

async function start(s) {
  if (running) return;
  cfg = { bitrateMbps: +s?.bitrateMbps || 8, keyframeS: +s?.keyframeS || 4, audioMode: s?.audioMode || 'copy' };
  if (!file) return;
  if (!info) info = await inspectFile(file);
  const sp = await checkSpace(cfg.bitrateMbps);
  if (!sp.ok) { log(sp.text); emit('error', { message: sp.text }); return; }

  TSTART = performance.now(); try { localStorage.setItem('jobRunning', '1'); } catch {}
  if (outFile) { outFile = null; await cleanOpfs(); }

  try { await run(); }

    log('ERRORE: ' + (e?.name || '') + ': ' + (e?.message || e) + '\n' + (e?.stack || ''));

async function run() {

  if (!opfsSupported()) throw new Error('OPFS non disponibile in questo browser');

  setProg('audio', 0, asrc ? 'audio' : 'nessun audio');
  if (asrc && echoFix) {
    const rm = echoFix.v4 ? null : echoFix.v3 ? createEchoRemoverV3({ delaySamples: echoFix.delaySamples, sampleRate: echoFix.sr, channels: echoFix.nch }) : echoFix.v2 ? createEchoRemoverV2({ delaySamples: echoFix.delaySamples, h: echoFix.h, mode: 'iir', channels: echoFix.nch }) : createEchoRemover({ delaySamples: echoFix.delaySamples, gain: echoFix.gain, gainHigh: echoFix.gainHigh, crossoverHz: echoFix.crossoverHz, sampleRate: echoFix.sr, channels: echoFix.nch });
    let nS = 0, t0In = null, emitted = 0; const sr = echoFix.sr;
    const emit = async (out) => { // output sample k ↔ input sample k (removers keep alignment; v3 delays emission only)
      const n = out[0]?.length || 0; if (!n) return;
      let start = t0In + emitted / sr - frames[0].ts; emitted += n; let skip = 0;
      if (start < 0) { skip = Math.min(n, Math.ceil(-start * sr - 1e-9)); start += skip / sr; }
      if (skip >= n) return; const m = n - skip, nch = out.length;
      const data = new Float32Array(m * nch); out.forEach((o, c) => data.set(o.subarray(skip), c * m));
      const as = new MB.AudioSample({ data, format: 'f32-planar', numberOfChannels: nch, sampleRate: sr, timestamp: start });
      await asrc.add(as); as.close(); nS++;
      if (nS % 32 === 0) { checkCancel(); await whenVisible(); setProg('audio', (start) / durS, 'audio ' + fmtT(start) + '/' + fmtT(durS)); }
    };
    if (echoFix.v4) { // whole-file, non-causal: decode everything, process once, emit in slices
      const parts = []; let total = 0;
      for await (const s of new MB.AudioSampleSink(aac).samples()) {
        if (t0In === null) t0In = s.timestamp;
        const n = s.numberOfFrames, inp = [];
        for (let c = 0; c < s.numberOfChannels; c++) { const b = new Float32Array(n); s.copyTo(b, { planeIndex: c, format: 'f32-planar' }); inp.push(b); }
        s.close(); parts.push(inp); total += n;
        if (parts.length % 64 === 0) { checkCancel(); await whenVisible(); setProg('audio', .4 * (s.timestamp / durS || 0), 'decodifica audio (v4, intero file)'); await new Promise((r) => setTimeout(r)); }
      }
      const ch = Array.from({ length: echoFix.nch }, (_, c) => { const o = new Float32Array(total); let k = 0; for (const p of parts) { o.set(p[c], k); k += p[c].length; } return o; });
      parts.length = 0; const tv = performance.now(); setProg('audio', .45, 'filtro v4 in corso (può richiedere minuti)'); await new Promise((r) => setTimeout(r, 30));
      const out = removeEchoV4(ch, sr, { delaySamples: echoFix.delaySamples });
      log(`v4 elaborato in ${((performance.now() - tv) / 1000).toFixed(1)} s`);
      for (let k = 0; k < total; k += 4096) await emit(out.map((o) => o.subarray(k, Math.min(total, k + 4096))));
    } else {
      for await (const s of new MB.AudioSampleSink(aac).samples()) {
        if (t0In === null) t0In = s.timestamp;
        const n = s.numberOfFrames, inp = [];
        for (let c = 0; c < s.numberOfChannels; c++) { const b = new Float32Array(n); s.copyTo(b, { planeIndex: c, format: 'f32-planar' }); inp.push(b); }
        s.close(); await emit(rm.process(inp));
      }
      if (rm.flush) await emit(rm.flush());
    }
    asrc.close(); log(`audio ${echoFix.reencOnly ? 'SOLO ricodificato (nessun filtro)' : 'corretto e ricodificato'} AAC 256 kbps (${nS} blocchi)`);
  } else if (asrc) { let first = true; const cfg = await aac.getDecoderConfig();
    let nA = 0;
    for await (const p of new MB.EncodedPacketSink(aac).packets()) { if (p.timestamp < 0) continue; await asrc.add(p.clone({ timestamp: p.timestamp - frames[0].ts }), first ? { decoderConfig: cfg } : undefined); first = false;
      if (++nA % 256 === 0) { checkCancel(); await whenVisible(); setProg('audio', p.timestamp / durS, 'audio ' + fmtT(p.timestamp) + '/' + fmtT(durS)); await new Promise((r) => setTimeout(r)); } }
    asrc.close(); }
  checkCancel(); setProg('scrittura', 0, 'chiusura file');
  vsrc.close(); await output.finalize(); cur.output = null; await store.flush();
  // moov in coda: lo riscrivo SENZA caricare mdat: leggo solo header + moov dal file OPFS, tronco a prefixLength e appendo il nuovo moov.
  const outSize = await store.size();
  const { prefixLength, moov } = await rewriteMoov({ size: outSize, read: (o, l) => store.read(o, l) }, (m) => { let x = srcMoov ? copySourceMetadata(srcMoov, m) : m; if (dvBox) x = insertIntoVideoSampleEntry(x, dvBox);
    x = setMetaString(x, 'com.apple.quicktime.displayname', label); x = setMetaString(x, 'com.apple.quicktime.description', `finally-compress-video ${VER} · target ${bitrate / 1e6} Mbps · keyframe ${gopSec}s · audio ${aTag}`); return x; });
  setProg('scrittura', .5, 'riscrittura moov');
  await store.truncate(prefixLength); await store.write(prefixLength, moov); await store.flush(); await store.close();
  const f0 = await store.getFile(); store = null;
  outFile = f0.type === 'video/mp4' && f0.name === outName ? f0 : new File([f0], outName, { type: 'video/mp4' }); // File su disco (OPFS), nessuna copia in RAM
  setProg('scrittura', 1, 'completato');
  log(`RPU trapiantati: ${rpuUsed}/${nChunks}${dvBox && rpuUsed !== nChunks ? ' ⚠️ INCOMPLETO' : ''}. Timestamp encoder spostati >2 ms: ${tsDrift}. Metadati originali copiati: ${srcMoov ? 'sì' : 'no'}.`);
  const pct = (1 - outFile.size / file.size) * 100;
  const mb = (b) => (b / 1048576).toFixed(2);
  log(`COMPRESSIONE: ${mb(file.size)} MB → ${mb(outFile.size)} MB (−${pct.toFixed(1)}%, ${(file.size / outFile.size).toFixed(2)}×). Bitrate medio ${(file.size * 8 / durS / 1e6).toFixed(1)} → ${(outFile.size * 8 / durS / 1e6).toFixed(1)} Mbps (target video ${bitrate / 1e6} Mbps, keyframe ogni ${gopSec} s), durata ${durS.toFixed(2)} s.`);
  log(`file: ${outName}`);
  log(`fatto in ${((performance.now() - T0) / 1000).toFixed(1)} s.`);
  emit('phase', { phase: 'fatto' }); emit('result', { inMB: file.size / MB_, outMB: outFile.size / MB_, savedPct: pct, fileName: outName });
}

function onSave() {
  // share() va chiamato subito nel tap (user activation ~5 s), senza await prima; promise non attesa per la UI.
  if (!outFile) return;
  if (!window.claude?.use) {
    const f = outFile; // File OPFS: niente copie in RAM
    if (navigator.canShare?.({ files: [f] })) { navigator.share({ files: [f] }).catch((e) => { if (e?.name !== 'AbortError') ui.setSaveMessage('Condivisione non riuscita: ' + e.message); }); return; }
    const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(outFile), download: outName }); document.body.appendChild(a); a.click(); a.remove(); return;
  }
  saveViaArtifact();
}
async function saveViaArtifact() {
  const dl = await window.claude.use('downloads');
  if (!dl) { ui.setSaveMessage( 'Il salvataggio non è disponibile in questa vista.'); return; }
  try { const r = await dl.save({ filename: outName, data: outFile }); ui.setSaveMessage( r.status === 'saved' ? 'Salvato. Aprilo da File e scegli «Salva video» per metterlo in Foto.' : ''); }
  catch (e) { ui.setSaveMessage( `Non salvato (${e.code || e.message}).`); }
}

ui = mountUI(document.getElementById('app'), {
  onFile, onStart: start, onCancel() { cancelled = true; log('Annullamento richiesto'); }, onSave,
  onCopyLog() { const t = ui.getLog(); const ok = () => ui.setCopyMessage('Copiato!'); const sel = () => ui.setCopyMessage('Seleziona e copia dal log'); if (navigator.clipboard?.writeText) navigator.clipboard.writeText(t).then(ok, sel); else sel(); },
}, { version: document.title.match(/v[\d.]+/)?.[0] });
ui.setDefaults({ bitrateMbps: 8, keyframeS: 4, audioMode: 'copy' });
// Niente zoom (iOS ignora user-scalable): blocco doppio tocco e pinch.
for (const t of ['dblclick', 'gesturestart', 'gesturechange']) document.addEventListener(t, (e) => e.preventDefault(), { passive: false });
let lastTouchEnd = 0;
document.addEventListener('touchend', (e) => { const n = Date.now(); if (n - lastTouchEnd < 350 && !e.target.closest?.('input,select,textarea')) e.preventDefault(); lastTouchEnd = n; }, { passive: false });
</script>
</body></html>
